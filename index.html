<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>科中庫存查詢</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'PingFang TC', sans-serif; background: #f5f2ed; color: #2c2416; min-height: 100vh; padding: 0 0 80px; }
  header { background: #2c2416; color: #f5f2ed; padding: 20px 20px 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.05em; }
  .sync-bar { font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; flex-shrink: 0; }
  .sync-dot.ok { background: #4cd97b; }
  .sync-dot.err { background: #ff6b6b; }
  .sync-dot.loading { background: #f0c040; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .card { background: #fff; border-radius: 16px; margin: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(44,36,22,0.07); }
  .card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8a7560; text-transform: uppercase; margin-bottom: 10px; }
  textarea { width: 100%; min-height: 160px; padding: 12px; font-size: 16px; font-family: -apple-system, 'PingFang TC', sans-serif; line-height: 1.7; color: #2c2416; background: #faf8f5; border: 1.5px solid #e0d8cc; border-radius: 12px; resize: none; outline: none; -webkit-appearance: none; }
  textarea:focus { border-color: #8a7560; background: #fff; }
  .hint { font-size: 12px; color: #a0906e; margin-top: 8px; line-height: 1.5; }
  .btn-group { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; padding: 14px 8px; font-size: 15px; font-weight: 600; font-family: -apple-system, 'PingFang TC', sans-serif; border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; -webkit-appearance: none; }
  .btn:active { opacity: 0.8; transform: scale(0.97); }
  .btn-primary { background: #2c2416; color: #f5f2ed; }
  .btn-ghost { background: #f0ebe3; color: #2c2416; flex: 0 0 auto; padding: 14px 16px; }
  .btn-refresh { background: #e8f0fe; color: #1a56cc; flex: 0 0 auto; padding: 14px 16px; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .stat { background: #faf8f5; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: #8a7560; margin-top: 2px; }
  .n-total { color: #2c2416; } .n-have { color: #2d7a4f; } .n-contract { color: #c97a1a; } .n-none { color: #c0392b; }
  .amount-box { border-radius: 12px; padding: 14px 16px; margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .amount-ok { background: #e8f5ee; } .amount-warn { background: #fef9e7; border: 1.5px solid #f0c040; }
  .amount-icon { font-size: 24px; } .amount-text { flex: 1; }
  .amount-total { font-size: 20px; font-weight: 700; }
  .amount-ok .amount-total { color: #1e6e3e; } .amount-warn .amount-total { color: #b07000; }
  .amount-msg { font-size: 12px; margin-top: 2px; }
  .amount-ok .amount-msg { color: #2d7a4f; } .amount-warn .amount-msg { color: #b07000; font-weight: 600; }
  .section-head { font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; }
  .head-have { background: #e8f5ee; color: #1e6e3e; }
  .head-contract { background: #fef3e2; color: #c97a1a; border: 1.5px solid #f0c040; }
  .head-none { background: #fdecea; color: #b03020; }
  .sub-label { font-size: 11px; font-weight: 600; color: #8a7560; letter-spacing: 0.06em; margin: 8px 0 5px 2px; }
  .tag-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .tag { font-size: 14px; padding: 6px 12px; border-radius: 20px; font-weight: 500; }
  .tag-have { background: #e8f5ee; color: #1e6e3e; }
  .tag-contract { background: #fef3e2; color: #c97a1a; border: 1px solid #f0c040; }
  .tag-reserve { background: #fdf3d8; color: #96700a; border: 1px solid #e8bb3c; }
  .tag-none { background: #fdecea; color: #b03020; }
  .tag-qty { font-size: 12px; opacity: 0.75; margin-left: 3px; }
  .preview-wrap { background: #faf8f5; border: 1.5px solid #e0d8cc; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .preview-wrap pre { font-family: -apple-system, 'PingFang TC', monospace; font-size: 14px; line-height: 1.9; color: #2c2416; white-space: pre-wrap; }
  .btn-copy { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; background: #2d7a4f; color: #fff; border: none; border-radius: 12px; cursor: pointer; -webkit-appearance: none; transition: opacity 0.15s, transform 0.1s; }
  .btn-copy:active { opacity: 0.8; transform: scale(0.98); }
  .btn-copy-miss { background: #c0392b; }
  .foot-note { font-size: 11px; color: #a0906e; text-align: center; margin-top: 10px; line-height: 1.6; }
  .hidden { display: none; }
  #loadingOverlay { position: fixed; inset: 0; background: rgba(44,36,22,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer; }
  .loading-box { background: #fff; border-radius: 16px; padding: 28px 32px; text-align: center; }
  .loading-box p { font-size: 15px; color: #2c2416; margin-top: 12px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #e0d8cc; border-top-color: #2c2416; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ac-wrap { position: relative; }
  .ac-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1.5px solid #8a7560; border-top: none; border-radius: 0 0 12px 12px; max-height: 260px; overflow-y: auto; z-index: 50; display: none; box-shadow: 0 6px 16px rgba(44,36,22,0.18); }
  .ac-dropdown.show { display: block; }
  .ac-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0ebe3; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.selected { background: #2c2416; color: #f5f2ed; }
  .ac-item:hover .ac-stock, .ac-item.selected .ac-stock { background: rgba(255,255,255,0.25); color: #fff; }
  .ac-item:hover .ac-cat, .ac-item.selected .ac-cat { background: rgba(255,255,255,0.25); color: #fff; }
  .ac-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-name b { font-weight: 700; }
  .ac-badges { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .ac-cat { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #f0ebe3; color: #8a7560; font-weight: 600; white-space: nowrap; }
  .ac-stock { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .ac-stock.st-have { background: #e8f5ee; color: #1e6e3e; }
  .ac-stock.st-reserve { background: #fdf3d8; color: #96700a; }
  .ac-stock.st-contract { background: #fef3e2; color: #c97a1a; }
  .ac-stock.st-none { background: #fdecea; color: #b03020; }
  .ac-empty { padding: 14px; text-align: center; color: #a0906e; font-size: 13px; }

</head>
<body>

</div>

<header>

  </div>
</header>

<div class="card">
  <div class="card-label">藥品清單</div>
  <div class="ac-wrap">
    <textarea id="inputArea" placeholder="直接貼上藥品清單即可，自動分類單方／複方

例如：
延胡索10
補陽還五湯8
荷葉2"></textarea>
    <div class="ac-dropdown" id="acDropdown"></div>
  </div>
  <p class="hint">✦ 品名後直接加數量（如：補陽還五湯8，小青龍湯錠5，或簡寫「小柴胡錠5」）<br>✦ 輸入時會跳出建議清單，可點選或用方向鍵＋Enter快速選取<br>✦ 自動判斷單方100g／單方200g／複方200g／錠劑500T<br>✦ 合約品項標示（約）、預訂品項標示（預）；低庫存正常顯示不特別標示</p>

<div id="resultArea" class="hidden">

    <div class="card-label">查詢結果</div>

    <div id="amountBox"></div>
  </div>

  </div>

  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7aEd2Xd24nhhkO5ofpcd-3bt5iFvDCRcya1THku0OvAcd7aQBEP7Cw8r4Q_cupliHCO2eQIYHxd_3/pub?output=csv';
const TABLET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREZkhefVsnrgm9gGs6afrmwMI9MvHhPNjMHbIz10ReSmuLhdJ7cq0ktaUSYfivPRhVsESppmrIadrP/pub?output=csv';
const HERB_STATUS = new Set(['有','無','合約']);
const TABLET_STATUS = new Set(['低','預訂','預約','合約','無']);
const THRESHOLD = 3330;
let invMap = {};
let lastUpdated = '';

const SINGLE100 = new Set(["大黃","大棗","山藥","川芎","川牛膝","三七","丹參","木香","生地黃","玉米鬚","甘草","白朮","白芍","白芷","北板藍根","石菖蒲","何首烏","赤芍","辛夷","防風","牡丹皮","延胡索","金銀花","羌活","知母","香附","厚朴","枳實","紅花","枳殼","苦參","柏子仁","炮附子","穿心蓮","威靈仙","益母草","桔梗","柴胡","秦艽","茯苓","荊芥","桂枝","桑葉","桑白皮","浙貝母","茵陳蒿","夏枯草","栝樓實","魚腥草","乾薑","淫羊藿","陳皮","荷葉","連翹","梔子","菊花","黃耆","黃芩","黃柏","黃連","紫蘇葉","番瀉葉","當歸","葛根","蒼朮","蒼耳子","綿茵陳","蒲黃","蒲公英","廣藿香","熟地黃","澤瀉","獨活","龍膽","薑黃","鎖陽","懷牛膝","黨參","續斷","鬱金"]);
const SINGLE200 = new Set(["麻黃"]);
const EXACT_ONLY = new Set(['麥門冬','薏苡仁','酸棗仁','桔梗','柴胡','當歸','川芎','茯苓','甘草','黃耆','黃芩','黃柏','黃連','菊花','葛根','防風','荊芥','桂枝','陳皮','蒼朮']);

function getCategory(name) {
  if(SINGLE200.has(name)) return '單方200g';
  if(SINGLE100.has(name)) return '單方100g';
  return '複方200g';
}

function parseCSVLine(line) {
  const result = [];
  let cur = ''; let inQ = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(c === '"'){ inQ = !inQ; }
    else if(c === ',' && !inQ){ result.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  result.push(cur.trim());
  return result;
}

function parseCSV(text, statusSet, catFn) {
  const newMap = {};
  const lines = text.split('\n');
  lines.forEach(line => {
    const cols = parseCSVLine(line);
    for(let i = 1; i < cols.length - 1; i++){
      const status = (cols[i]||'').trim().replace(/^"|"$/g,'');
      if(statusSet.has(status)){
        const name = (cols[i-1]||'').trim().replace(/^"|"$/g,'');
        const priceRaw = (cols[i+1]||'').trim().replace(/^"|"$/g,'').replace(/,/g,'');
        const price = parseInt(priceRaw) || 0;
        if(name && name.length >= 2 && isNaN(Number(name)) && !/^[\d劃單複方gml以上每目實際]+$/.test(name)){
          const cat = catFn(name);
          newMap[name.replace(/\s/g,'')] = {n: name, s: status, p: price, cat: cat};
        }
      }
    }
  });
  return newMap;
}

async function loadCSV() {
  const dot = document.getElementById('syncDot');
  const msg = document.getElementById('syncMsg');
  dot.className = 'sync-dot loading';
  msg.textContent = '更新中...';
  try {
    const [herbRes, tabletRes] = await Promise.all([
      fetch(CSV_URL + '&t=' + Date.now()),
      fetch(TABLET_CSV_URL + '&t=' + Date.now())
    ]);
    if(!herbRes.ok) throw new Error('科中 HTTP ' + herbRes.status);
    if(!tabletRes.ok) throw new Error('錠劑 HTTP ' + tabletRes.status);
    const [herbText, tabletText] = await Promise.all([herbRes.text(), tabletRes.text()]);
    const herbMap = parseCSV(herbText, HERB_STATUS, getCategory);
    const tabletMap = parseCSV(tabletText, TABLET_STATUS, function(){ return '錠劑500T'; });
    invMap = Object.assign({}, herbMap, tabletMap);
    const count = Object.keys(invMap).length;
    const now = new Date();
    lastUpdated = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    dot.className = 'sync-dot ok';
    msg.textContent = `已同步 ${count} 項（含錠劑500T ${Object.keys(tabletMap).length} 項）｜${lastUpdated}`;
    document.getElementById('footNote').textContent = `⚠ 庫存每日變動，以實際出單為準｜同步：${lastUpdated}`;
  } catch(e) {
    dot.className = 'sync-dot err';
    msg.textContent = '同步失敗，請點🔄重試';
  }
  document.getElementById('loadingOverlay').style.display = 'none';
}

function norm(s){ return s.replace(/\s+/g,'').replace(/[（）【】()[\]×x、，,。.！!？?]/g,''); }

function parseLine(line){
  let s = line.replace(/[Xx×＊*]/g, ' ').trim();
  const addMatch = s.match(/^(.+?)\s*(\d+\s*\+\s*\d+)$/);
  if(addMatch && addMatch[1].trim().length > 0){
    const parts = addMatch[2].split('+').map(n=>parseInt(n.trim()));
    const total = parts.reduce((a,b)=>a+b,0);
    return {name: addMatch[1].trim(), qty: total, qtyDisplay: addMatch[2].trim()};
  }
  const numMatch = s.match(/^(.+?)\s*(\d+)$/);
  if(numMatch && numMatch[1].trim().length > 0){
    return {name: numMatch[1].trim(), qty: parseInt(numMatch[2]), qtyDisplay: numMatch[2]};
  }
  return {name: line.trim(), qty: 1, qtyDisplay: '1'};
}

  '人參養榮':'人參養榮湯','養陰清肺':'養陰清肺湯','百合固金':'百合固金湯','清燥救肺':'清燥救肺湯',
  '荊芥連翹':'荊芥連翹湯','獨活寄生':'獨活寄生湯','疏經活血':'疏經活血湯','川芎茶調':'川芎茶調散',
  '潤腸丸':'潤腸湯',
};

function fuzzyFind(input) {
  const n = norm(input);

  // 1. 完全符合
  if(invMap[n]) return invMap[n];

  // 2. 特殊簡寫對照表
  for(const [alias, full] of Object.entries(ALIAS)){
    if(n === norm(alias)){
      const fullNorm = norm(full);
      if(invMap[fullNorm]) return invMap[fullNorm];
    }
  }

  // 3. 「簡寫＋錠」查錠劑：先去掉尾巴的「錠」，用簡寫對照表解析出完整湯劑名稱，
  //    再補回「錠」查錠劑庫存（例如打「小柴胡錠」會自動查「小柴胡湯錠」）
  if(n.endsWith('錠')){
    const base = n.slice(0, -1);
    let baseFull = null;
    if(invMap[base]){
      baseFull = invMap[base].n;
    } else {
      for(const [alias, full] of Object.entries(ALIAS)){
        if(base === norm(alias)){ baseFull = full; break; }
      }
    }
    if(baseFull){
      const tabletKey = norm(baseFull) + '錠';
      if(invMap[tabletKey]) return invMap[tabletKey];
    }
  }

  // 找不到就回傳 null（不做模糊比對）
  return null;
}

function statusToState(status){
  if(status === '有' || status === '低') return 'have';
  if(status === '合約') return 'contract';
  if(status === '預訂' || status === '預約') return 'reserve';
  return 'miss'; // 無 或其他未知狀態
}

function statusSuffix(st){
  if(st === 'contract') return '（約）';
  if(st === 'reserve') return '（預）';
  return '';
}

function statusTagClass(st){
  if(st === 'contract') return 'tag-contract';
  if(st === 'reserve') return 'tag-reserve';
  return 'tag-have';
}

const IGNORE_LINES = new Set([
  '謝謝','謝謝！','謝謝!','感謝','感謝！',
  '訂單確認','訂單確認：',
  '缺藥清單','缺藥清單：',
  '（庫存每日變動，以實際出單為準）',
]);

function checkInventory(){
  if(Object.keys(invMap).length === 0){ alert('庫存尚未載入，請點🔄更新後再試'); return; }
  const raw = document.getElementById('inputArea').value.trim();
  if(!raw) return;
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0)
    .filter(l => !/^【.+】$/.test(l))  // 忽略「【單方100g】」這類分類標題行
    .filter(l => !IGNORE_LINES.has(l)); // 忽略「謝謝」「訂單確認」等範本／招呼語
  const items = [];
  lines.forEach(line => {
    const {name, qty, qtyDisplay} = parseLine(line);
    const found = fuzzyFind(name);
    if(found){
      const st = statusToState(found.s);
      const displayName = found.n;
      items.push({name: displayName, qty, qtyDisplay, st, price: found.p, cat: found.cat});
    } else {
      items.push({name, qty, qtyDisplay, st:'miss', price: 0, cat: '無藥證'});
    }
  });
  renderResults(items);
}

function groupByCategory(items) {
  const order = ['複方200g','單方100g','單方200g','錠劑500T','無藥證'];
  const map = {};
  items.forEach(i => {
    if(!map[i.cat]) map[i.cat] = [];
    map[i.cat].push(i);
  });
  return order.filter(k=>map[k]&&map[k].length).map(k=>({label:k, items:map[k]}));
}

function renderResults(items){
  const haveItems = items.filter(i=>i.st==='have' || i.st==='reserve' || i.st==='contract');
  const badItems = items.filter(i=>i.st==='miss');

  let total = 0; let hasTimePrice = false;
  haveItems.forEach(i=>{ if(i.price===0) hasTimePrice=true; else total += i.price*i.qty; });

  document.getElementById('resultArea').classList.remove('hidden');
  document.getElementById('statsCards').innerHTML = `
    <div class="stat"><div class="stat-num n-total">${items.length}</div><div class="stat-lbl">查詢品項</div></div>
    <div class="stat"><div class="stat-num n-have">${haveItems.length}</div><div class="stat-lbl">訂單確認</div></div>
    <div class="stat"><div class="stat-num n-none">${badItems.length}</div><div class="stat-lbl">無庫存／無藥證</div></div>
  `;

  const amountBox = document.getElementById('amountBox');
  if(haveItems.length > 0){
    const isWarn = total < THRESHOLD;
    amountBox.innerHTML = `
      <div class="amount-box ${isWarn?'amount-warn':'amount-ok'}">
        <div class="amount-icon">${isWarn?'⚠️':'✅'}</div>
        <div class="amount-text">
          <div class="amount-total">訂單合計：$${total.toLocaleString()}${hasTimePrice?' (部分時價未計)':''}</div>
          <div class="amount-msg">${isWarn?`⚠ 未達 $3,330，尚差 $${(THRESHOLD-total).toLocaleString()}`:'已超過 $3,330，沒問題'}</div>
        </div>
      </div>`;
  } else { amountBox.innerHTML=''; }

  // 有庫存
  const haveCard = document.getElementById('haveCard');
  if(haveItems.length){
    haveCard.classList.remove('hidden');
    document.getElementById('haveArea').innerHTML = groupByCategory(haveItems).map(g=>`
      <div class="sub-label">${g.label}</div>
      <div class="tag-wrap">${g.items.map(i=>{
        const cls = statusTagClass(i.st);
        const suffix = statusSuffix(i.st);
        return `<span class="tag ${cls}">${i.name}${suffix}<span class="tag-qty">×${i.qtyDisplay}</span></span>`;
      }).join('')}</div>
    `).join('');
  } else { haveCard.classList.add('hidden'); }


  // 無庫存
  const noneCard = document.getElementById('noneCard');
  if(badItems.length){
    noneCard.classList.remove('hidden');
    document.getElementById('noneArea').innerHTML = groupByCategory(badItems).map(g=>`
      <div class="sub-label">${g.label}</div>
      <div class="tag-wrap">${g.items.map(i=>`<span class="tag tag-none">${i.name}<span class="tag-qty">×${i.qtyDisplay}</span></span>`).join('')}</div>
    `).join('');
  } else { noneCard.classList.add('hidden'); }

  // 訂單確認訊息
  let previewHave = '訂單確認：\n';
  if(haveItems.length){
    groupByCategory(haveItems).forEach(g=>{ previewHave+=`【${g.label}】\n`; g.items.forEach(i=>{ previewHave+=`${i.name}${statusSuffix(i.st)} ${i.qtyDisplay}\n`; }); });
  } else { previewHave+='（無）\n'; }
  previewHave += '\n（庫存每日變動，以實際出單為準）';
  document.getElementById('previewHaveText').textContent = previewHave;

  // 缺藥清單訊息
  const missCard = document.getElementById('missPreviewCard');
  if(badItems.length){
    missCard.classList.remove('hidden');
    let previewMiss = '缺藥清單：\n';
    groupByCategory(badItems).forEach(g=>{ previewMiss+=`【${g.label}】\n`; g.items.forEach(i=>{ previewMiss+=`${i.name} ${i.qtyDisplay}\n`; }); });
    document.getElementById('previewMissText').textContent = previewMiss;
  } else { missCard.classList.add('hidden'); }

  setTimeout(()=>{ document.getElementById('resultArea').scrollIntoView({behavior:'smooth'}); }, 100);
}

function clearAll(){
  document.getElementById('inputArea').value='';
  document.getElementById('resultArea').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

function copyText(elId, btn){
  const text = document.getElementById(elId).textContent;
  const original = btn.textContent;
  const restore = () => { btn.textContent = original; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{ btn.textContent='已複製！✓'; setTimeout(restore, 2500); });
  } else {
    const ta = document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); btn.textContent='已複製！✓'; setTimeout(restore, 2500); } catch(e){}
    document.body.removeChild(ta);
  }
}

// ===== 自動完成下拉建議 =====
let acItems = [];
let acIndex = -1;
let acVisible = false;
let acDebounce = null;

function stockInfo(status){
  const st = statusToState(status);
  if(st === 'have') return {cls:'st-have', label: status === '低' ? '✅ 有貨(低)' : '✅ 有貨'};
  if(st === 'contract') return {cls:'st-contract', label:'📋 合約'};
  if(st === 'reserve') return {cls:'st-reserve', label:'⏳ 預訂'};
  return {cls:'st-none', label:'⚠️ 缺貨'};
}

function highlightMatch(name, q){
  const idx = name.indexOf(q);
  if(idx === -1) return name;
  return name.slice(0,idx) + '<b>' + name.slice(idx, idx+q.length) + '</b>' + name.slice(idx+q.length);
}

function searchSuggestions(query){
  const q = norm(query);
  if(!q) return [];
  const found = new Map(); // key: canonical name -> {item, score}

  function add(item, score){
    const key = item.n;
    const cur = found.get(key);
    if(!cur || score > cur.score) found.set(key, {item, score});
  }

  // 1. 完全符合／簡寫對照表／簡寫+錠（沿用查詢時同一套邏輯）
  const exact = fuzzyFind(q);
  if(exact) add(exact, 100);

  // 2. 包含匹配
  Object.values(invMap).forEach(item=>{
    const nn = norm(item.n);
    if(nn.includes(q) || q.includes(nn)) add(item, 80);
  });

  // 3. 粗略模糊比對（字元重疊比例）
  if(q.length >= 2){
    Object.values(invMap).forEach(item=>{
      const nn = norm(item.n);
      const matched = [...q].filter(c=>nn.includes(c)).length;
      const score = Math.round(matched / q.length * 70);
      if(score >= 40) add(item, score);
    });
  }

  const list = [...found.values()];
  list.sort((a,b)=>{
    const aw = norm(a.item.n).startsWith(q) ? 0 : 1;
    const bw = norm(b.item.n).startsWith(q) ? 0 : 1;
    if(aw !== bw) return aw - bw;
    const rank = (item)=>{
      const st = statusToState(item.s);
      if(st==='have') return 0;
      if(st==='contract') return 1;
      if(st==='reserve') return 2;
      return 3;
    };
    const ra = rank(a.item), rb = rank(b.item);
    if(ra !== rb) return ra - rb;
    return b.score - a.score;
  });

  return list.slice(0, 30).map(x=>x.item);
}

function initAutocomplete(){
  const textarea = document.getElementById('inputArea');
  textarea.addEventListener('input', handleAcInput);
  textarea.addEventListener('keydown', handleAcKeydown);
  textarea.addEventListener('click', hideAutocomplete);
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.ac-wrap')) hideAutocomplete();
  });
}

function handleAcInput(e){
  if(acDebounce) clearTimeout(acDebounce);
  acDebounce = setTimeout(()=>{
    const textarea = e.target;
    const cursorPos = textarea.selectionStart;
    const lines = textarea.value.substring(0, cursorPos).split('\n');
    const currentLine = lines[lines.length-1].trim();
    const cleanLine = currentLine.replace(/[\dXx×\+\s]+$/, '').trim();
    if(cleanLine.length >= 1 && Object.keys(invMap).length > 0){
      showAcSuggestions(cleanLine);
    } else {
      hideAutocomplete();
    }
  }, 200);
}

function handleAcKeydown(e){
  if(!acVisible) return;
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    acIndex = Math.min(acIndex+1, acItems.length-1);
    updateAcSelection();
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    acIndex = Math.max(acIndex-1, 0);
    updateAcSelection();
  } else if(e.key === 'Enter' || e.key === 'Tab'){
    if(acIndex >= 0){
      e.preventDefault();
      selectAcItem(acItems[acIndex]);
    }
  } else if(e.key === 'Escape'){
    hideAutocomplete();
  }
}

function showAcSuggestions(query){
  const dropdown = document.getElementById('acDropdown');
  const matches = searchSuggestions(query);

  if(matches.length === 0){
    dropdown.innerHTML = '<div class="ac-empty">無符合品項</div>';
    dropdown.classList.add('show');
    acVisible = true; acItems = []; acIndex = -1;
    return;
  }

  const q = norm(query);
  dropdown.innerHTML = matches.map((item, i)=>{
    const s = stockInfo(item.s);
    return `<div class="ac-item" data-index="${i}">
      <span class="ac-name">${highlightMatch(item.n, q)}</span>
      <span class="ac-badges"><span class="ac-cat">${item.cat}</span><span class="ac-stock ${s.cls}">${s.label}</span></span>
    </div>`;
  }).join('');

  dropdown.querySelectorAll('.ac-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectAcItem(matches[parseInt(el.dataset.index)]);
    });
    el.addEventListener('mouseenter', ()=>{
      acIndex = parseInt(el.dataset.index);
      updateAcSelection();
    });
  });

  dropdown.classList.add('show');
  acVisible = true; acItems = matches; acIndex = -1;
}

function updateAcSelection(){
  const dropdown = document.getElementById('acDropdown');
  dropdown.querySelectorAll('.ac-item').forEach((el, i)=>{
    if(i === acIndex){ el.classList.add('selected'); el.scrollIntoView({block:'nearest'}); }
    else el.classList.remove('selected');
  });
}

function selectAcItem(item){
  const textarea = document.getElementById('inputArea');
  const value = textarea.value;
  const cursorPos = textarea.selectionStart;
  const lines = value.replace(/\r\n/g,'\n').split('\n');
  let lineStart = 0, lineIndex = 0;
  for(let i=0;i<lines.length;i++){
    if(lineStart + lines[i].length >= cursorPos){ lineIndex = i; break; }
    lineStart += lines[i].length + 1;
  }
  const currentLine = lines[lineIndex];
  const numMatch = currentLine.match(/(\d+(\s*\+\s*\d+)*)\s*$/);
  const quantity = numMatch ? numMatch[1] : '';
  lines[lineIndex] = item.n + quantity;
  textarea.value = lines.join('\n');
  const newPos = lineStart + item.n.length;
  textarea.setSelectionRange(newPos, newPos);
  textarea.focus();
  hideAutocomplete();
}

function hideAutocomplete(){
  document.getElementById('acDropdown').classList.remove('show');
  acVisible = false; acIndex = -1; acItems = [];
}

loadCSV();
initAutocomplete();
</script>
